name: DMIT Stock Monitor

on:
  schedule:
    # 单一 cron：每 5 分钟一次（此前两个交错 cron 会造成并发 push 冲突，
    # 且每 2.5 分钟一次过于频繁、浪费额度；DMIT 补货窗口远大于 5 分钟）
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a test alert email/push (true to send)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: dmit-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Check stock
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.test_alert != 'true'
        env:
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          QQ_FROM: ${{ secrets.QQ_FROM }}
          QQ_TO: ${{ secrets.QQ_TO }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: node gh-monitor.js

      - name: Send test alert
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_alert == 'true'
        env:
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          QQ_FROM: ${{ secrets.QQ_FROM }}
          QQ_TO: ${{ secrets.QQ_TO }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: node gh-monitor.js --testmail

      - name: Persist state
        if: always()
        run: |
          git config user.name "dmit-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          # 状态同步是"尽力而为"：先拉取远端再提交，避免并发/迟到的远端提交
          # 导致 push 被拒（fetch first）；无论最终 push 成败都不让任务报失败，
          # 防止 GitHub 向仓库主人发送失败邮件（下次运行会自动补交状态）。
          git pull --rebase origin main || echo "pull failed, continue"
          # 同步 state.json 到 status/ 目录（GitHub Pages 同源托管），
          # 状态页直接读相对路径，避免依赖 raw.githubusercontent.com（国内常被墙）
          cp state.json status/state.json
          git add state.json status/state.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "update state [skip ci]" || echo "nothing to commit"
            git push || echo "push failed (will retry next run)"
          fi
