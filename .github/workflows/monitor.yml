name: DMIT Stock Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a test alert email/push (true to send)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: dmit-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Check stock
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.test_alert != 'true'
        env:
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          QQ_FROM: ${{ secrets.QQ_FROM }}
          QQ_TO: ${{ secrets.QQ_TO }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: node gh-monitor.js

      - name: Send test alert
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_alert == 'true'
        env:
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          QQ_FROM: ${{ secrets.QQ_FROM }}
          QQ_TO: ${{ secrets.QQ_TO }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: node gh-monitor.js --testmail

      - name: Persist state
        if: always()
        run: |
          git config user.name "dmit-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "update state [skip ci]"
            git push
          fi
